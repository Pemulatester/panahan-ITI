<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - UKM Panahan ITI</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #e74c3c;
            --secondary: #2c3e50;
            --accent: #f39c12;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #333;
        }
        
        .admin-container {
            text-align: center;
            max-width: 800px;
            padding: 30px;
        }
        
        .admin-logo {
            margin-bottom: 30px;
        }
        
        .admin-logo img {
            height: 80px;
        }
        
        .admin-content {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }
        
        .admin-title {
            color: var(--secondary);
            margin-bottom: 20px;
        }
        
        .admin-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }
        
        .admin-card {
            background: #f9f9f9;
            padding: 20px;
            border-radius: 8px;
            text-decoration: none;
            color: var(--secondary);
            transition: all 0.3s;
            border: 1px solid #eee;
        }
        
        .admin-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            border-color: var(--primary);
        }
        
        .admin-card i {
            font-size: 2rem;
            color: var(--primary);
            margin-bottom: 15px;
        }
        
        .error-message {
            color: #e74c3c;
            background: #fde8e8;
            padding: 20px;
            border-radius: 5px;
            margin-bottom: 20px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="admin-container">
        <div class="admin-logo">
            <img src="logo_panahan.jpg" alt="UKM Panahan ITI">
        </div>
        
        <div id="error-message" class="error-message">
            <i class="fas fa-exclamation-circle"></i>
            <h3>Akses Ditolak!</h3>
            <p>Anda tidak memiliki izin untuk mengakses halaman ini.</p>
            <p>Gunakan URL dengan password yang benar.</p>
        </div>
        
        <div id="admin-content" class="admin-content" style="display:none;">
            <h1 class="admin-title">Panel Admin UKM Panahan ITI</h1>
            <p>Selamat datang di panel admin rahasia</p>
            
            <div class="admin-grid">
                <a href="admin/berita.html" class="admin-card">
                    <i class="fas fa-newspaper"></i>
                    <h3>Kelola Berita</h3>
                    <p>Tambah/edit berita</p>
                </a>
                
                <a href="admin/anggota.html" class="admin-card">
                    <i class="fas fa-users"></i>
                    <h3>Data Anggota</h3>
                    <p>Kelola anggota</p>
                </a>
                
                <a href="admin/galeri.html" class="admin-card">
                    <i class="fas fa-images"></i>
                    <h3>Galeri Foto</h3>
                    <p>Upload foto kegiatan</p>
                </a>
            </div>
        </div>
    </div>

    <script>
        // Cek password dari URL
        const urlParams = new URLSearchParams(window.location.search);
        const password = urlParams.get('password');
        
        if(password === 'PASSWORD123') {
            document.getElementById('admin-content').style.display = 'block';
        } else {
            document.getElementById('error-message').style.display = 'block';
            
            // Redirect setelah 3 detik
            setTimeout(() => {
                window.location.href = 'index.html';
            }, 3000);
        }
    </script>
</body>
</html>
