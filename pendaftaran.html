<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pendaftaran UKM Panahan</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <header>
        <div class="header-container">
            <div class="logo-wrapper">
                <img src="logo_panahan.jpg" alt="Logo Panahan" class="logo">
                <h1 class="site-title">UKM Panahan</h1>
            </div>
            <button class="menu-toggle" aria-label="Toggle Menu">
                <i class="fas fa-bars"></i> <!-- Ikon hamburger -->
            </button>
            <nav class="nav-menu">
                <ul>
                    <li><a href="index.html">Beranda</a></li>
                    <li><a href="pendaftaran.html">Pendaftaran</a></li>
                    <li><a href="berita.html">Berita</a></li>
                </ul>
            </nav>
        </div>
        <div class="overlay"></div>
    </header>

    <main class="container">
        <section class="registration-form">
            <h2>Formulir Pendaftaran</h2>
            <form action="#" method="post">
                <div class="form-group">
                    <label for="nama">Nama Lengkap:</label>
                    <input type="text" id="nama" name="nama" required>
                </div>
                <div class="form-group">
                    <label for="kampus">Kampus:</label>
                    <input type="text" id="kampus" name="kampus" required>
                </div>
                <div class="form-group">
                    <label for="fakultas">Fakultas:</label>
                    <input type="text" id="fakultas" name="fakultas" required>
                </div>
                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="hp">No. HP:</label>
                    <input type="tel" id="hp" name="hp" required>
                </div>
                <div class="form-group">
                    <label for="pengalaman">Pengalaman Panahan:</label>
                    <select id="pengalaman" name="pengalaman">
                        <option value="pemula">Pemula</option>
                        <option value="menengah">Menengah</option>
                        <option value="mahir">Mahir</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="alasan">Alasan Bergabung:</label>
                    <textarea id="alasan" name="alasan" rows="4" required></textarea>
                </div>
                <button type="submit" class="btn">Daftar</button>
            </form>
        </section>
    </main>

    <footer>
        <div class="footer-content">
            <p>&copy; 2025 UKM Panahan ITI.</p>
        </div>
    </footer>

    <script>
        const menuToggle = document.querySelector('.menu-toggle');
        const nav = document.querySelector('.nav-menu');
        const overlay = document.querySelector('.overlay');

        menuToggle.addEventListener('click', function() {
            nav.classList.toggle('active');
            overlay.classList.toggle('active');
        });

        overlay.addEventListener('click', function() {
            nav.classList.remove('active');
            overlay.classList.remove('active');
        });
    </script>
</body>
</html>
