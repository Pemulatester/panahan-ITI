<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pendaftaran UKM Panahan</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>

    </style>
    
</head>
<body>
    <header>
        <div class="header-container">
            <a href="index.html" class="logo-wrapper">
                <img src="logo_panahan.jpg" alt="Logo Panahan" class="logo">
                <h1 class="site-title">UKM Panahan</h1>
            </a>
            <button class="menu-toggle" aria-label="Toggle Menu">
                <i class="fas fa-bars"></i>
            </button>
            <nav class="nav-menu">
                <ul>
                    <li><a href="index.html">Beranda</a></li>
                    <li><a href="pendaftaran.html">Pendaftaran</a></li>
                    <li><a href="berita.html">Berita</a></li>
                </ul>
            </nav>
        </div>
        <div class="overlay"></div>
    </header>

    <main class="container">
        <section class="registration-form">
            <h2>Formulir Pendaftaran</h2>
            <form action="#" method="post">
                <div class="form-group">
                    <label for="nama">Nama Lengkap:</label>
                    <input type="text" id="nama" name="nama" required>
                </div>
                <div class="form-group">
                    <label for="kampus">Kampus:</label>
                    <input type="text" id="kampus" name="kampus" required>
                </div>
                <div class="form-group">
                    <label for="fakultas">Fakultas:</label>
                    <input type="text" id="fakultas" name="fakultas" required>
                </div>
                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="hp">No. HP:</label>
                    <input type="tel" id="hp" name="hp" required>
                </div>
                <div class="form-group">
                    <label for="pengalaman">Pengalaman Panahan:</label>
                    <select id="pengalaman" name="pengalaman">
                        <option value="pemula">Pemula</option>
                        <option value="menengah">Menengah</option>
                        <option value="mahir">Mahir</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="alasan">Alasan Bergabung:</label>
                    <textarea id="alasan" name="alasan" rows="4" required></textarea>
                </div>
                <button type="submit" class="btn">Daftar Sekarang</button>
            </form>
        </section>
    </main>

    <footer>
        <div class="footer-content">
            <p>&copy; 2025 UKM Panahan ITI. Semua hak dilindungi.</p>
        </div>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const menuToggle = document.querySelector('.menu-toggle');
            const navMenu = document.querySelector('.nav-menu');
            const overlay = document.querySelector('.overlay');
            let lastScrollY = window.scrollY;
            let ticking = false;
        
            // Fungsi toggle menu
            const toggleMenu = () => {
                menuToggle.classList.toggle('active');
                navMenu.classList.toggle('active');
                overlay.classList.toggle('active');
                document.body.classList.toggle('menu-open');
            };
        
            // Fungsi close menu
            const closeMenu = () => {
                menuToggle.classList.remove('active');
                navMenu.classList.remove('active');
                overlay.classList.remove('active');
                document.body.classList.remove('menu-open');
            };
        
            // Toggle menu saat klik hamburger
            menuToggle.addEventListener('click', toggleMenu);
        
            // Close menu saat klik overlay
            overlay.addEventListener('click', closeMenu);
        
            // Close menu saat klik link
            document.querySelectorAll('.nav-menu a').forEach(link => {
                link.addEventListener('click', closeMenu);
            });
        
            // Auto-close saat scroll
            window.addEventListener('scroll', () => {
                if (!navMenu.classList.contains('active')) return;
                
                lastScrollY = window.scrollY;
                
                if (!ticking) {
                    window.requestAnimationFrame(() => {
                        if (Math.abs(lastScrollY - window.scrollY) > 5) {
                            closeMenu();
                        }
                        ticking = false;
                    });
                    ticking = true;
                }
            });
        });
        </script>
</body>
</html>
